[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dropzone-worker"
version = "1.0.0"
description = "DROPZONE Universal Desktop Downloader Background Worker Engine"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Hz Creatives (KR Hasni Zihar)", email = "hasnizihar751@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "psutil>=5.9.0",
    "yt-dlp>=2026.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

